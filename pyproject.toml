[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-expression-service"
version = "0.1.0"
description = "NCBI GEO expression lookup with caching and chat agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pydantic-ai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "httpx2>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["geo_expression_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["geo_expression_service", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["geo_expression_service"]
